<!doctype html>
<!-- Menu ngắn (8 món, giá viết tắt nghìn đồng) — test chụp ảnh trang này rồi gửi cho model đọc ảnh (spec 018 AC-4.1, AC-4.2) -->
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <style>
    body { margin: 0; width: 640px; padding: 40px; font-family: Arial, sans-serif; background: #fdf8f0; color: #222; }
    h1 { text-align: center; margin: 0 0 24px; font-size: 34px; letter-spacing: 2px; }
    h2 { font-size: 22px; border-bottom: 2px solid #222; padding-bottom: 4px; margin: 24px 0 8px; }
    .row { display: flex; justify-content: space-between; font-size: 20px; padding: 6px 0; }
  </style>
</head>
<body>
  <h1>QUÁN THỬ NGHIỆM</h1>
  <h2>CÀ PHÊ</h2>
  <div class="row"><span>Cà phê đen</span><span>25</span></div>
  <div class="row"><span>Cà phê sữa</span><span>29</span></div>
  <div class="row"><span>Bạc xỉu</span><span>32</span></div>
  <div class="row"><span>Cà phê muối</span><span>35</span></div>
  <h2>TRÀ</h2>
  <div class="row"><span>Trà đào cam sả</span><span>45</span></div>
  <div class="row"><span>Trà vải</span><span>42</span></div>
  <div class="row"><span>Trà sen vàng</span><span>48</span></div>
  <div class="row"><span>Trà tắc</span><span>20</span></div>
</body>
</html>
